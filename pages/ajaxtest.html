<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple Bootstrap Form</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script>
$(document).ready(function () {
    $("#processdata").on("submit", function (e) {
        e.preventDefault(); // ⛔ stop normal form submit

        let text = $("#textInput").val(); // ✅ get textarea value

        $.ajax({
            type: "POST",
            url: "/processdata",
            data: {
                username: text // ✅ must match Go FormValue
            },
            beforeSend: function () {
                $("#output").html("⏳ PROCESSING...");
            },
            success: function (data) {
                // data is JSON → { response: "..." }
                $("#output").html(data);
            },
            error: function () {
                $("#output").html("❌ Error contacting server");
            }
        });
    });
});
</script>



<body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">

                <div class="card p-4 shadow">
                    <h4 class="mb-3 text-center">Simple Text Input Form</h4>

                    <form method ="POST" action="processdata" id="processdata">
                        <div class="mb-3">
                            <label for="textInput" class="form-label">Enter Text</label>
                            <input name ="username"
                                type="text" 
                                class="form-control" 
                                id="textInput" 
                                placeholder="Type something..."
                            >
                        </div>

                        <button type="submit" class="btn btn-primary w-100">
                            Submit
                        </button>

                        <div id="output" >xxx</div>
                    </form>
                </div>

            </div>
        </div>
    </div>

    <!-- Bootstrap JS (optional) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
